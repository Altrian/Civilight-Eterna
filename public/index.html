<!DOCTYPE html>
<html lang="en" class="dark dracula">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Selector PWA</title>
    <link rel="icon" href="static/icons/icon_512.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="static/styles.css">
    <script src="static/src/layout.js" defer></script>
    <script type="module" src="static/src/script.js" defer></script>
    <meta name="theme-color" content="#282a36" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#282a36" media="(prefers-color-scheme: dark)">

</html>

<body>
    <div class="header-sentinel"></div>
    <section class="toast-notifications">
        <div class="toast-container" data-toast-position="top"></div>
        <div class="toast-container" data-toast-position="bottom"></div>
    </section>
    <div id="view">
        <div id="content" data-skip-transition data-drawer-active="true">
            <nav>
                <div class="shade"></div>
                <div class="drawer">
                    <div class="drawer-contain">
                        <div class="drawer-logo">
                            <button class="btn" data-drawer-close="">
                                <span class="btn-text">
                                    <svg data-v-9ba4cb7e="" data-v-6495c397="" xmlns="http://www.w3.org/2000/svg"
                                        width="24" height="24" fill="none" viewBox="0 0 24 24" class="icon"
                                        style="color: currentcolor;">
                                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                            stroke-width="2" d="M18 6 6 18M6 6l12 12"></path>
                                    </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </nav>
            <main>
                <header>
                    <div class="header-main">
                        <div class="header">
                            <div class="header-logo">
                                <buttton class="btn btn-header" data-drawer-open="">
                                    <span class="btn-text">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
                                            viewBox="0 0 24 24" class="icon">
                                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                                stroke-width="2" d="M3 12h12M3 6h18M3 18h6"></path>
                                        </svg>
                                    </span>
                                </buttton>
                            </div>
                        </div>
                        <div class="header-background"></div>
                    </div>
                </header>
                <div class="header-height"></div>
                <div class="content">
                    <div class="layout-container recruitment">
                        <div class="title">
                            <p>Recruitment Calculator</p>
                            <div class="gap"></div>
                            <div class="input">
                                <div class="recruitment-search">
                                    <form class="input-form recruitment-input" id="tag-input-form" role="search"
                                        aria-label="Search tags">
                                        <input type="text" id="tag-input" placeholder="Search tags" autocomplete="off">
                                        <div class="input-border"></div>
                                        <div class="search-icon">
                                            <svg class="icon small" xmlns="http://www.w3.org/2000/svg" width="24"
                                                height="24" fill="none" viewBox="0 0 24 24">
                                                <path stroke="currentColor" stroke-linecap="round"
                                                    stroke-linejoin="round" stroke-width="2"
                                                    d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16m10 2-4.35-4.35"></path>
                                            </svg>
                                        </div>
                                        <div class="search-hint">
                                            <span class="hint-icon">Ctrl</span>
                                            <span class="hint-icon">K</span>
                                        </div>
                                    </form>
                                </div>

                                <div class="recruitment-settings">
                                    <div class="view">
                                        <span class="view-label">View: </span>
                                        <div class="toggle-group" role="radiogroup" aria-labelledby="view-mode-select">
                                            <label class="btn btn-radio" role="radio" tabindex="0" aria-checked="false">
                                                <span class="radio-icon">
                                                    <svg data-v-9ba4cb7e="" data-v-b597ada3=""
                                                        xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                                        fill="none" viewBox="0 0 24 24" class="">
                                                        <path stroke="currentColor" stroke-linecap="round"
                                                            stroke-linejoin="round" stroke-width="2"
                                                            d="M10 3H3v7h7zm11 0h-7v7h7zm0 11h-7v7h7zm-11 0H3v7h7z">
                                                        </path>
                                                    </svg>
                                                    <input type="radio" id="portrait" name="view-mode" value="portrait"
                                                        class="radio-input" hidden>
                                                </span>
                                            </label>
                                            <label class="btn btn-radio" role="radio" tabindex="0" aria-checked="false">
                                                <span class="radio-icon">
                                                    <svg data-v-9ba4cb7e="" data-v-b597ada3=""
                                                        xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                                        fill="none" viewBox="0 0 24 24">
                                                        <path stroke="currentColor" stroke-linecap="round"
                                                            stroke-linejoin="round" stroke-width="2"
                                                            d="M21 3H3v7h18zm0 11H3v7h18z"></path>
                                                    </svg>
                                                    <input type="radio" id="avatar" name="view-mode" value="avatar"
                                                        class="radio-input" hidden>
                                                </span>
                                            </label>
                                            <label class="btn btn-radio" role="radio" tabindex="0" aria-checked="false">
                                                <span class="radio-icon">
                                                    <svg data-v-9ba4cb7e="" data-v-b597ada3=""
                                                        xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                                        fill="none" viewBox="0 0 24 24">
                                                        <path stroke="currentColor" stroke-linecap="round"
                                                            stroke-linejoin="round" stroke-width="2"
                                                            d="M21 3H3v7h18zm0 11H3v7h18z"></path>
                                                    </svg>
                                                    <input type="radio" id="list" name="view-mode" value="list"
                                                        class="radio-input" hidden>
                                                </span>
                                            </label>
                                        </div>
                                    </div>
                                    <button id="recruitment-settings" class="btn"
                                        popovertarget="recruitment-settings-popover" popovertargetaction="toggle"
                                        aria-label="Settings">
                                        <span class="btn-text">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
                                                viewBox="0 0 24 24" class="icon">
                                                <path stroke="currentColor" stroke-linecap="round"
                                                    stroke-linejoin="round" stroke-width="2"
                                                    d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6"></path>
                                                <path stroke="currentColor" stroke-linecap="round"
                                                    stroke-linejoin="round" stroke-width="2"
                                                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 3.417 1.415 2 2 0 0 1-.587 1.415l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1">
                                                </path>
                                            </svg>
                                        </span>
                                    </button>
                                    <div id="recruitment-settings-popover" class="modal modal-settings" popover
                                        anchor="recruitment-settings">
                                        <div class="modal-content">
                                            <div class="toggle-group" role="radiogroup" aria-labelledby="server-select">
                                                <label class="btn btn-radio" role="radio" tabindex="0"
                                                    aria-checked="false">
                                                    <span class="radio-icon">
                                                        <svg data-v-9ba4cb7e="" data-v-b597ada3=""
                                                            xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                                            fill="none" viewBox="0 0 24 24" class="">
                                                            <path stroke="currentColor" stroke-linecap="round"
                                                                stroke-linejoin="round" stroke-width="2"
                                                                d="M10 3H3v7h7zm11 0h-7v7h7zm0 11h-7v7h7zm-11 0H3v7h7z">
                                                            </path>
                                                        </svg>
                                                        <input type="radio" id="Global" name="Server"
                                                            value="Global" class="radio-input" hidden>
                                                    </span>
                                                </label>
                                                <label class="btn btn-radio" role="radio" tabindex="0"
                                                    aria-checked="false">
                                                    <span class="radio-icon">
                                                        <svg data-v-9ba4cb7e="" data-v-b597ada3=""
                                                            xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                                            fill="none" viewBox="0 0 24 24">
                                                            <path stroke="currentColor" stroke-linecap="round"
                                                                stroke-linejoin="round" stroke-width="2"
                                                                d="M21 3H3v7h18zm0 11H3v7h18z"></path>
                                                        </svg>
                                                        <input type="radio" id="CN" name="Server" value="CN"
                                                            class="radio-input" hidden>
                                                    </span>
                                                </label>
                                            </div>
                                            <div class="recruitment-buttons">
                                                <label class="checkbox" tabindex="0" role="checkbox"
                                                    for="toggle-rarity-common" aria-disabled="false"
                                                    aria-checked="false">
                                                    <span class="icon">
                                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                                            fill="none" stroke="currentColor" stroke-linecap="round"
                                                            stroke-linejoin="round" stroke-width="2" class="icon"
                                                            viewBox="0 0 24 24">
                                                            <rect width="18" height="18" x="3" y="3" rx="2" ry="2">
                                                            </rect>
                                                        </svg>
                                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                                            fill="none" viewBox="0 0 24 24" class="icon hidden">
                                                            <path stroke="currentColor" stroke-linecap="round"
                                                                stroke-linejoin="round" stroke-width="2"
                                                                d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11">
                                                            </path>
                                                            <path stroke="rgb(var(--theme-primary))"
                                                                stroke-linecap="round" stroke-linejoin="round"
                                                                stroke-width="2" d="m9 11 3 3L22 4"></path>
                                                        </svg>
                                                        <input type="checkbox" id="toggle-rarity-common"
                                                            class="checkbox-input" hidden>
                                                    </span>
                                                    <span>Hide Low Rarity</span>
                                                </label>
                                                <label class="checkbox" tabindex="0" role="checkbox"
                                                    for="toggle-rarity-robot" aria-disabled="false"
                                                    aria-checked="false">
                                                    <span class="icon">
                                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                                            fill="none" stroke="currentColor" stroke-linecap="round"
                                                            stroke-linejoin="round" stroke-width="2" class="icon"
                                                            viewBox="0 0 24 24">
                                                            <rect width="18" height="18" x="3" y="3" rx="2" ry="2">
                                                            </rect>
                                                        </svg>
                                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                                            fill="none" viewBox="0 0 24 24" class="icon hidden">
                                                            <path stroke="currentColor" stroke-linecap="round"
                                                                stroke-linejoin="round" stroke-width="2"
                                                                d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11">
                                                            </path>
                                                            <path stroke="rgb(var(--theme-primary))"
                                                                stroke-linecap="round" stroke-linejoin="round"
                                                                stroke-width="2" d="m9 11 3 3L22 4"></path>
                                                        </svg>
                                                        <input type="checkbox" id="toggle-rarity-robot"
                                                            class="checkbox-input" hidden>
                                                    </span>
                                                    <span>Hide Robots</span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div id="tag-selection" class="tag-selection"></div>
                        <div id="recruitment-list" class="recruitment-list"
                            data-hide-common="false" data-hide-robot="false" data-view-mode="portrait" data-server="Global">
                            <div class="recruitment-list-container">
                            </div>
                        </div>
                    </div>
            </main>
        </div>
    </div>
</body>
